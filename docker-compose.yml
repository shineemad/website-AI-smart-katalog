services:
  # Replica set rs0: mongodb = PRIMARY (data lama tetap dipakai), mongo2/mongo3 = SECONDARY.
  # Anggota di-advertise via host.docker.internal agar bisa diakses dari host maupun antar-container.
  mongodb:
    image: mongo:7
    container_name: smartcatalog-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo2:
    image: mongo:7
    container_name: smartcatalog-mongo2
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:7
    container_name: smartcatalog-mongo3
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    ports:
      - "27019:27019"
    volumes:
      - mongo3_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: smartcatalog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: smartcatalog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  mongo2_data:
  mongo3_data:
  minio_data:
